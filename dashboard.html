<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />

    <title>午餐管理系統</title>
    <meta property="og:title" content="午餐管理系統" />
<meta
  property="og:description"
  content="員工午餐訂餐與管理系統"
/>
<meta property="og:type" content="website" />
<meta
  property="og:url"
  content="https://kaori-ivan.github.io/lunch-order-system/dashboard.html"
/>

    <link rel="preconnect" href="https://fonts.googleapis.com" />

    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

    <link
      href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />

    <link rel="stylesheet" href="dashboard.css" />
  </head>

  <body>
    <div id="pageLoading" class="page-loading">
  <div class="page-loading-card">
    <div class="page-loading-icon">🍱</div>

    <div class="page-loading-spinner"></div>

    <h3>正在載入午餐資料</h3>

    <p>
      請稍候，系統正在同步最新訂餐資訊...
    </p>
  </div>
</div>
    <div class="app-shell">
      <aside class="sidebar">
        <div class="brand">
          <div class="brand-mark">🍱</div>

          <div>
            <h1>午餐管理系統</h1>
            <p>管理者後台</p>
          </div>
        </div>

        <nav id="nav"></nav>
        <div class="sidebar-version">
  午餐管理系統 Version 1.0.0
</div>
      </aside>

      <main class="main">
        <header class="topbar">
          <div>
            <p class="eyebrow">LUNCH MANAGEMENT</p>

            <h2 id="pageTitle">首頁總覽</h2>

            <p id="pageSubtitle">快速掌握下週訂餐與本週供餐狀況</p>
          </div>

          <div class="top-actions">
            <div class="info-card week-info-card">
              <span>📅</span>

              <div>
                <small>下週訂餐週期</small>
                <b id="nextWeekRange"> 讀取中... </b>
              </div>
            </div>
          </div>
        </header>
        

        <section id="content"></section>
      </main>
    </div>

    <div class="toast" id="toast"></div>

    <div class="modal-backdrop" id="modalBackdrop">
      <div class="modal">
        <div class="modal-head">
          <h3 id="modalTitle">編輯資料</h3>

          <button id="closeModal">×</button>
        </div>

        <div id="modalBody"></div>
      </div>
    </div>

    <script src="js/config.js"></script>
    <script src="dashboard.js"></script>
    <script src="js/weekly-summary.js"></script>
  </body>
</html>
